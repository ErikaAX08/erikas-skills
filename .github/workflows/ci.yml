name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm pack --dry-run
      - run: node ./scripts/install.mjs --help 2>&1 | head -n 5
      - run: npx --yes erikas-skills list 2>&1 | head -n 20
        # smoke: list should contain 14 entries
