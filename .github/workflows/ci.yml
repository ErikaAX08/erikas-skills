name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail, so a failing command before a pipe fails the step

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run test:cli
      - run: pnpm run test:spec-kit
      - run: pnpm run test:pre-pr-review
      - run: pnpm pack --dry-run
      - name: Smoke test the local CLI
        run: |
          node cli/cli.mjs --help > /dev/null
          listed=$(node cli/cli.mjs list | grep -c '^ - ')
          expected=$(grep -c '^  - ' pnpm-workspace.yaml)
          echo "cli list: $listed skills, workspace: $expected"
          test "$listed" -eq "$expected"
          node cli/cli.mjs install --target dir --dir "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/brand-guidelines/SKILL.md"
